<?xml version="1.0" encoding="UTF-8"?>
<!--
  A3 — 星核（Spark Core）  ← 优化目标：增加自有细节
  四角星被大量 AI 产品使用（Gemini / Copilot 一路），单靠剪影很难"专属"。
  办法是在中心压一颗白核（沿用你概念板里 B/C/D 的白点语汇）：
  星的四臂于是读作"向心汇入核心"，既补了 AI 核心语义，又多了一个自有细节。
  白核半径 6.5 < 凹口 11.95，不会顶穿星的边缘（留了 5.45 的安全余量）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="星核">
  <defs>
    <linearGradient id="a3g" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#409EFF"/>
    </linearGradient>
  </defs>
  <path d="M 32 4 C 34.2 21, 43 29.8, 60 32 C 43 34.2, 34.2 43, 32 60 C 29.8 43, 21 34.2, 4 32 C 21 29.8, 29.8 21, 32 4 Z"
        fill="url(#a3g)"/>
  <circle cx="32" cy="32" r="6.5" fill="#FFFFFF"/>
</svg>
