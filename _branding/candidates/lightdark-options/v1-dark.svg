  </defs>
  <rect x="5" y="5" width="54" height="54" rx="15" fill="#0A0F1C"/>
  <path d="M32 15 C 33.3 27, 37 30.7, 49 32 C 37 33.3, 33.3 37, 32 49 C 30.7 37, 27 33.3, 15 32 C 27 30.7, 30.7 27, 32 15 Z" fill="url(#v1ds)"/>
