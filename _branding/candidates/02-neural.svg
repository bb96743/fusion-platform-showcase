    </linearGradient>
  </defs>
  <g stroke="#409EFF" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M15 15 L32 32"/>
    <path d="M49 15 L32 32"/>
    <path d="M15 49 L32 32"/>
    <path d="M49 49 L32 32"/>
  </g>
  <circle cx="15" cy="15" r="4.5" fill="#409EFF"/>
  <circle cx="49" cy="15" r="4.5" fill="#409EFF"/>
  <circle cx="15" cy="49" r="4.5" fill="#409EFF"/>
  <circle cx="49" cy="49" r="4.5" fill="#409EFF"/>
  <circle cx="32" cy="32" r="9" fill="url(#c2g)"/>
