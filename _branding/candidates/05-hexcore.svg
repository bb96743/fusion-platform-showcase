<!--
  候选 05 — 六边核心（Hex Core）
  理念：圆角六边形外壳 + 三条辐条汇聚到中心核 —— 芯片/AI 加速器是最典型的科技意象；
  「多路汇入一核」也是融合。
  关键词：AI 芯片 · 核心算力 · 六边几何
  颜色：外壳与辐条 #409EFF；核心 #409EFF -> #36CFC9 渐变
  几何：外六边形半径 25（顶点 32±21.65 / 32±25）；辐条由内接半径 15 指向核心边缘 7.5
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="六边核心">
  <defs>
    <linearGradient id="c5g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#36CFC9"/>
    </linearGradient>
  </defs>
  <path d="M32 7 L53.65 19.5 V 44.5 L32 57 L10.35 44.5 V 19.5 Z"
        fill="none" stroke="#409EFF" stroke-width="5.5" stroke-linejoin="round"/>
  <g stroke="#409EFF" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M32 17 V 24.5"/>
    <path d="M45 39.5 L 38.5 35.75"/>
    <path d="M19 39.5 L 25.5 35.75"/>
  </g>
  <circle cx="32" cy="32" r="7.5" fill="url(#c5g)"/>
</svg>
