<?xml version="1.0" encoding="UTF-8"?>
<!--
  S5 — 核心轨道（Orbit Core）
  简化思路：**一个实心核 + 两段对置的粗圆弧**，三个元素讲完「AI 核心 + 环绕运转」。
  去掉了上一版六边形与辐条那类细节；圆弧对置自带旋转动势。
  关键词：AI 核心 · 轨道 · 运转
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="核心轨道">
  <defs>
    <linearGradient id="s5g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#36CFC9"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#409EFF" stroke-width="9" stroke-linecap="round">
    <path d="M32 8 A24 24 0 0 1 56 32"/>
    <path d="M32 56 A24 24 0 0 1 8 32"/>
  </g>
  <circle cx="32" cy="32" r="8.5" fill="url(#s5g)"/>
</svg>
