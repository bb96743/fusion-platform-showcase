<?xml version="1.0" encoding="UTF-8"?>
<!--
  S2 — 双半合圆（Twin Disc）
  简化思路：极限简化 —— **两半正在合拢成一个圆**，左右两半用品牌双色。
  两轮修正记录（2026-10-05，均为渲染复核后返工）：
    ① 最初两半严丝合缝拼成整圆 → 16px 下糊成单色圆点，完全看不出「两半」；
    ② 改成 4 单位缝隙 → 48px 能看出，16px 仍分辨不出；
    ③ 本版：缝隙加到 **8 单位**（左半圆心 x=28、右半 x=36，半径收到 24 保持边距）
       → 小尺寸下也能读出「两块正在合拢」。
  关键词：融合 · 二元合一 · 极简
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="双半合圆">
  <path d="M28 8 A24 24 0 0 0 28 56 Z" fill="#409EFF"/>
  <path d="M36 8 A24 24 0 0 1 36 56 Z" fill="#36CFC9"/>
</svg>
