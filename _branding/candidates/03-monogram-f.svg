<?xml version="1.0" encoding="UTF-8"?>
<!--
  候选 03 — F 电路（F Circuit）
  理念：品牌首字母 F 画成一条连续电路走线，中间的分支点是「汇入」；
  最利于品牌识别（一眼是 F），科技感来自电路式的直角与圆角端头。
  关键词：品牌首字母 · 电路走线 · 分支汇聚
  颜色：#409EFF；分支节点 #409EFF -> #36CFC9 渐变
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="F 电路">
  <defs>
    <linearGradient id="c3g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#36CFC9"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#409EFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 52 V 12 H 48"/>
    <path d="M16 32 H 38"/>
  </g>
  <circle cx="16" cy="32" r="4.5" fill="url(#c3g)"/>
</svg>
