<!--
  候选 06 — 无限交织（Infinity Weave）
  理念：两个环在同一结点交汇成无限符号 —— 融合（两环合一）+ 持续学习/持续演进（无限）；
  用两种颜色区分两个来源，交汇点是「合」。
  关键词：融合 · 持续学习 · 无限演进
  颜色：左环 #409EFF，右环 #36CFC9（双色区分「两个来源」）
  说明：两段曲线在 (32,32) 处相接，各自闭合成环
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="无限交织">
  <path d="M32 32 C 32 22, 24 15, 17.5 15 C 10 15, 6 22.5, 6 32 C 6 41.5, 10 49, 17.5 49 C 24 49, 32 42, 32 32"
        fill="none" stroke="#409EFF" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M32 32 C 32 22, 40 15, 46.5 15 C 54 15, 58 22.5, 58 32 C 58 41.5, 54 49, 46.5 49 C 40 49, 32 42, 32 32"
        fill="none" stroke="#36CFC9" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="4" fill="#409EFF"/>
</svg>
