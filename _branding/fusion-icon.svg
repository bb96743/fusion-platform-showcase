<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fusion 项目图标（唯一定稿版）

  设计：品牌渐变圆角方盒（#8B5CF6 -> #409EFF） + **实心白色**四角火花。

  为什么火花必须是"实心白"而不是镂空：
    A5 原版用的是 evenodd 镂空（火花透出背景色）。放在白页上时它确实显白，
    但放到深色侧边栏（#001529）上就会**变成深色** —— 因为透出的是深色背景。
    既然现在固定只用一张图、且要求"白星"，就必须用实心白填充，
    这样在深色侧边栏、登录页深色层、白页、浏览器标签页上**都是白星**。

  为什么不再需要亮/暗两个版本：
    方盒是**不透明的品牌渐变**，它自身与浅底/深底都有足够反差
    （渐变两端对 #001529 为 4.35:1 / 6.63:1，对白底为 4.23:1 / 2.78:1），
    因此同一张图可以直接用在两种背景上，无需再分版本、也就不需要那个开关。

  几何：圆角方盒 56x56（圆角 16，画布 64x64）；火花中心 (32,32)、半宽 17。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Fusion">
  <defs>
    <linearGradient id="fusionTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#409EFF"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#fusionTile)"/>
  <path d="M32 15 C 33.3 27, 37 30.7, 49 32 C 37 33.3, 33.3 37, 32 49
           C 30.7 37, 27 33.3, 15 32 C 27 30.7, 30.7 27, 32 15 Z"
        fill="#FFFFFF"/>
</svg>
