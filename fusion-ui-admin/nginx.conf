# ============================================================================
#  Fusion 前端 nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
#  承担三件事：
#    1) SPA 的 history 路由回退（找不到文件就交给 index.html）
#    2) 把 /admin-api 反向代理到后端（前端的 VITE_BASE_URL 是空值 = 同源）
#    3) 静态资源缓存与 gzip
#
#  ⚠️ 尚未在真实 nginx 上验证（开发机未安装 Docker/nginx）。
#     若你的部署是「nginx 与后端不在同一个 compose 网络」，
#     请把 upstream 里的 fusion-server:48080 改成实际地址。
# ============================================================================

upstream fusion_backend {
    # docker-compose 的服务名；非容器部署时改成 127.0.0.1:48080
    server fusion-server:48080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 100m;   # 上传附件/图片

    # ---- 压缩 ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss image/svg+xml font/woff2;

    # ---- 带 hash 的构建产物：长期缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 图标/图片：中等缓存 ----
    location ~* \.(?:ico|gif|png|jpe?g|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- 后端接口（含 WebSocket 升级）----
    location /admin-api/ {
        proxy_pass         http://fusion_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket（infra 的 WebSocketSenderApi 用到）
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # SSE / 流式接口（AI 对话是 text/event-stream）：必须关缓冲，否则前端拿不到增量
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- 后端接口文档（Knife4j / springdoc）----
    # 生产默认不暴露（application-prod.yaml 里已把 api-docs 关掉）；
    # 需要时放开下面两段。
    # location /doc.html { proxy_pass http://fusion_backend; }
    # location /v3/api-docs { proxy_pass http://fusion_backend; }

    # ---- SPA 路由回退：必须放在最后 ----
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，保证发版后立刻生效
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
